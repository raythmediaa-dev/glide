name: Build Windows exe
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        shell: cmd
        env:
          CI: "1"
        run: build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: Glide-windows
          path: dist/Glide.exe

      - name: Publish to Releases
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "Latest build of Glide for Windows (commit ${{ github.sha }}). Download Glide.exe below and double-click it."
          gh release delete latest --yes --cleanup-tag 2>$null
          gh release create latest dist/Glide.exe --title "Glide for Windows (latest)" --notes $notes --target ${{ github.sha }}

      # ---- Smoke tests on the packaged exe ----
      - name: Self-test real downloads
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force test-out | Out-Null
          $p = Start-Process dist\Glide.exe -PassThru -Wait -ArgumentList @(
            '--selftest', "$PWD\test-out\report.json", "$PWD\test-out",
            'https://www.youtube.com/watch?v=jNQXAC9IVRw',
            'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4')
          Get-Content test-out\report.json
          Get-ChildItem test-out | Format-Table Name, Length
          exit $p.ExitCode
      - name: Launch app and screenshot
        shell: pwsh
        continue-on-error: true
        run: |
          $app = Start-Process dist\Glide.exe -PassThru
          Start-Sleep -Seconds 40
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\test-out\screenshot.png")
          Get-Process | Where-Object { $_.MainWindowTitle } | Format-Table ProcessName, MainWindowTitle
          if ($app.HasExited) { Write-Error "Glide exited early with code $($app.ExitCode)" } else { Stop-Process -Id $app.Id -Force }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: |
            test-out/report.json
            test-out/screenshot.png
